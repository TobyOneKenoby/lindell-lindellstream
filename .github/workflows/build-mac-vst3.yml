name: Build Lindell Streams Mac VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: external/JUCE
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Mbed-TLS/mbedtls
          ref: v3.6.4
          submodules: recursive
          path: external/mbedtls
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            build
            tls-build
            tls-install
          key: lsl-mac-universal-v1-${{ github.sha }}
          restore-keys: lsl-mac-universal-v1-
      - name: Check native build inputs
        id: native-reuse
        env:
          NATIVE_CACHE_KEY: ${{ steps.native-cache.outputs.cache-matched-key }}
        run: python3 Scripts/can-reuse-native.py
      - name: Build universal static TLS dependency
        if: steps.native-reuse.outputs.reuse != 'true'
        run: |
          python3 external/mbedtls/scripts/config.py -f external/mbedtls/include/mbedtls/mbedtls_config.h set MBEDTLS_SSL_DTLS_SRTP
          cmake -S external/mbedtls -B tls-build -G Xcode \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DENABLE_PROGRAMS=OFF -DENABLE_TESTING=OFF -DMBEDTLS_FATAL_WARNINGS=OFF \
            -DUSE_SHARED_MBEDTLS_LIBRARY=OFF -DUSE_STATIC_MBEDTLS_LIBRARY=ON \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/tls-install"
          cmake --build tls-build --config Release --parallel 3
          cmake --install tls-build --config Release
      - name: Configure universal VST3
        if: steps.native-reuse.outputs.reuse != 'true'
        run: |
          cmake -S . -B build -G Xcode \
            -DJUCE_PATH="$GITHUB_WORKSPACE/external/JUCE" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/tls-install" \
            '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Build plugin and test programs
        if: steps.native-reuse.outputs.reuse != 'true'
        run: cmake --build build --config Release --parallel 3 --target LindellStreamsLive_VST3 lsl_plugin_test lsl_media_test lsl_core_tests lsl_link_tests lsl_tls_test
      - name: TLS relay certificate and framing tests
        run: |
          mkdir -p tls-fixture
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost' -keyout tls-fixture/key.pem -out tls-fixture/cert.pem
          security add-trusted-cert -r trustRoot -k "$HOME/Library/Keychains/login.keychain-db" tls-fixture/cert.pem
          python3 Tests/tls-echo.py tls-fixture/cert.pem tls-fixture/key.pem > tls-fixture/server.log 2>&1 &
          TLS_FIXTURE_PID=$!
          trap 'kill "$TLS_FIXTURE_PID"; security remove-trusted-cert tls-fixture/cert.pem' EXIT
          sleep 1
          build/Release/lsl_tls_test
      - name: Core and codec tests
        run: ctest --test-dir build -C Release --output-on-failure -R '^(core|playlist_links|codec_stereo)$'
      - name: Sign and verify bundle
        run: |
          PLUGIN='build/LindellStreamsLive_artefacts/Release/VST3/Lindell Streams Live.vst3'
          lipo "$PLUGIN/Contents/MacOS/Lindell Streams Live" -verify_arch arm64 x86_64
          codesign --force --sign - --timestamp=none "$PLUGIN"
          codesign --verify --strict --verbose=2 "$PLUGIN"
          otool -L "$PLUGIN/Contents/MacOS/Lindell Streams Live" > dependencies.txt
          if grep -E '/opt/homebrew|/Users/runner|/usr/local' dependencies.txt; then exit 1; fi
      - name: Load actual VST3, null test and render UI
        run: build/lsl_plugin_test_artefacts/Release/lsl_plugin_test "$GITHUB_WORKSPACE/build/LindellStreamsLive_artefacts/Release/VST3/Lindell Streams Live.vst3"
      - name: Install browser for real WebRTC test
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install chromium
      - name: Verify decoded stereo audio in Chromium
        run: node Tests/BrowserTest.cjs "$GITHUB_WORKSPACE/build/Release/lsl_media_test"
      - name: Package plugin
        env:
          NATIVE_SOURCE: ${{ steps.native-reuse.outputs.source }}
        run: |
          mkdir -p release
          ditto 'build/LindellStreamsLive_artefacts/Release/VST3/Lindell Streams Live.vst3' 'release/Lindell Streams Live.vst3'
          cp INSTALL-PLUGIN.txt Lindell-Streams-Preview.png dependencies.txt release/
          mkdir -p release/ThirdParty
          cp build/_deps/rtc-src/LICENSE release/ThirdParty/libdatachannel.txt
          cp build/_deps/opus-src/COPYING release/ThirdParty/opus.txt
          cp build/_deps/samplerate-src/COPYING release/ThirdParty/libsamplerate.txt
          cp external/mbedtls/LICENSE release/ThirdParty/mbedtls.txt
          cp external/JUCE/LICENSE.md release/ThirdParty/JUCE.md
          python3 - <<'PYLICENSE'
          from pathlib import Path
          import shutil
          for dependency in ('libjuice', 'libsrtp', 'usrsctp', 'plog'):
              root = Path('build/_deps/rtc-src/deps') / dependency
              for source in root.rglob('*'):
                  if source.is_file() and source.name.lower().startswith(('license', 'copying')):
                      target = Path('release/ThirdParty') / dependency / source.relative_to(root)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(source, target)
          PYLICENSE
          printf 'Source: %s\nJUCE: %s\n' "$NATIVE_SOURCE" "$(git -C external/JUCE rev-parse HEAD)" > release/BUILD-INFO.txt
          ditto -c -k --sequesterRsrc --keepParent release Lindell-Streams-Mac-VST3.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Lindell-Streams-Mac-VST3-${{ github.run_number }}
          path: Lindell-Streams-Mac-VST3.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            build
            tls-build
            tls-install
          key: lsl-mac-universal-v1-${{ github.sha }}
