name: Package macOS beta installer
on:
  push:
    branches: [main]
    paths: ['Installer/**', '.github/workflows/package-mac-installer.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installer:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download tested 0.3.1 universal VST3
        uses: actions/download-artifact@v5
        with:
          name: Lindell-Streams-Mac-VST3-6
          run-id: 35478954205
          github-token: ${{ github.token }}
          path: incoming
      - name: Build, sign, notarize and test installer
        id: package
        env:
          MAC_CERTIFICATES_P12_BASE64: ${{ secrets.MAC_CERTIFICATES_P12_BASE64 }}
          MAC_CERTIFICATES_PASSWORD: ${{ secrets.MAC_CERTIFICATES_PASSWORD }}
          MAC_APPLICATION_IDENTITY: ${{ secrets.MAC_APPLICATION_IDENTITY }}
          MAC_INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash Installer/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Lindell-Streams-Installer-${{ steps.package.outputs.mode }}-${{ github.run_number }}
          path: installer-output/
          if-no-files-found: error
          retention-days: 30
